server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing — any path that isn't a real file falls back to
    # index.html so React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied to the backend container by its Compose service name. Using a
    # variable in proxy_pass (rather than a bare hostname) forces nginx to
    # re-resolve it through Docker's embedded DNS (127.0.0.11) on every
    # request instead of caching the IP once at config load — a plain
    # `proxy_pass http://api:8000/...` resolves once and keeps that IP
    # forever, which 502'd here the moment the api container was recreated
    # (its IP changed, nginx never noticed) with "connection refused" to a
    # now-stale address. Caught live, not in a code review.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api:8000;

    # No path suffix on proxy_pass here — with a *variable* upstream, nginx
    # stops doing its usual "replace the matched location prefix" rewrite (that
    # rewriting only happens for a static proxy_pass value). Omitting a path
    # here means the original request URI passes through unchanged instead,
    # which is exactly right since the backend's own routes already live under
    # /api/v1/*. Adding a /api/ suffix here (the first version of this file)
    # silently produced the wrong upstream path — caught live as a 404, not
    # the 502 the DNS-caching fix above was actually aimed at.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat streaming is newline-delimited JSON over a long-lived response —
        # buffering would hold the whole thing until the connection closes.
        proxy_buffering off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
