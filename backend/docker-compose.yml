# Same fixed project name as ../docker-compose.yml — see that file's comment.
# Running `docker compose up` from here (backend-only, no frontend container)
# and from the repo root both then resolve to the same containers/volumes.
name: karnataka-crime-platform

services:
  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      # Bootstrap credentials for the container's own initdb — driven by the
      # same .env values the app connects with (POSTGRES_USER/PASSWORD), not a
      # second hardcoded source of truth that can drift from it.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-karnataka_crime}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ─────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20
    environment:
      # NEO4J_AUTH takes the combined "user/password" form the image expects —
      # driven by .env's NEO4J_USER/NEO4J_PASSWORD (resolved at `docker compose`
      # parse time) rather than a second hardcoded credential pair that could
      # silently drift from what the app actually connects with.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p '${NEO4J_PASSWORD}' 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Container-network hostnames — deliberately override whatever .env has,
      # since .env's defaults (localhost) are for running the API outside
      # Docker. `environment:` takes precedence over `env_file:` in Compose, so
      # this is what actually wins regardless of .env's POSTGRES_HOST/etc.
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Vertex AI — override per-environment here if needed
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-gemini-2.5-flash-lite}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: "384"
    ports:
      # Host-side 8090, not 8000 — something else on this machine already owns
      # 127.0.0.1:8000 (a separate WSL distro's service), and Windows resolves
      # "localhost" to that more specific loopback binding ahead of Docker's
      # own 0.0.0.0:8000 proxy. The container's internal port is still 8000.
      - "8090:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/app
      - uploads:/uploads
      - ./secrets/gcp-service-account.json:/secrets/gcp-service-account.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery worker ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./:/app
      - uploads:/uploads
      # DEBT-03 fix: workers need access to uploaded files (e.g. document
      # ingestion tasks read from UPLOAD_DIR). Without this mount the named
      # volume only existed on the api container and workers saw empty /uploads.
    command: >
      celery -A app.tasks.celery_app.celery_app worker
      --loglevel=info --concurrency=4

  # ── Celery Beat (scheduled tasks) ─────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
    volumes:
      - ./:/app
    command: >
      celery -A app.tasks.celery_app.celery_app beat
      --loglevel=info

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  uploads:
