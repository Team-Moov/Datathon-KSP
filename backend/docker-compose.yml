version: "3.9"

services:
  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: karnataka_crime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ─────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_password", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Vertex AI / Gemini — override per-environment here if needed
      GCP_PROJECT: ${GCP_PROJECT}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      LLM_MODEL: ${LLM_MODEL:-gemini-1.5-pro-002}
      LLM_MODEL_FLASH: ${LLM_MODEL_FLASH:-gemini-1.5-flash-002}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-004}
      EMBEDDING_DIM: "768"
      # Mount SA key for local dev; on GCP use Workload Identity instead
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/sa-key.json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/app
      - uploads:/tmp/uploads
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/secrets/sa-key.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery worker ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      GCP_PROJECT: ${GCP_PROJECT}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/sa-key.json
    depends_on:
      - redis
      - postgres
    volumes:
      - ./:/app
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/secrets/sa-key.json:ro
    command: >
      celery -A app.tasks.celery_app.celery_app worker
      --loglevel=info --concurrency=4

  # ── Celery Beat (scheduled tasks) ─────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./:/app
    command: >
      celery -A app.tasks.celery_app.celery_app beat
      --loglevel=info

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  uploads:
